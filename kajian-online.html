<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kajian Online</title>
<meta name="theme-color" content="#0b0d12">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #ffffff;
    --text: #14181f;
    --glass-bg: rgba(120, 140, 170, 0.10);
    --glass-edge: rgba(20, 30, 50, 0.18);
    --glass-shade: rgba(20, 30, 50, 0.22);
    --glass-glow: rgba(255, 255, 255, 0.9);
    --press: rgba(20, 30, 50, 0.07);
    --garis: rgba(20, 30, 50, 0.14);
    --silang: #d64545;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --kaca: rgba(255, 255, 255, 0.42);
    --kaca-ringan: rgba(255, 255, 255, 0.28);
    --kaca-tepi: rgba(255, 255, 255, 0.8);
    --kilau: rgba(255, 255, 255, 0.95);
    --cincin: rgba(30, 40, 70, 0.08);
    --bayang: rgba(40, 55, 90, 0.14);
    --panel: rgba(250, 251, 253, 0.86);
    --emas: #b08d4f;
    --emas-muda: #ecdcb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --text: #eef1f6;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-edge: rgba(255, 255, 255, 0.28);
      --glass-shade: rgba(0, 0, 0, 0.55);
      --glass-glow: rgba(255, 255, 255, 0.22);
      --press: rgba(255, 255, 255, 0.1);
      --garis: rgba(255, 255, 255, 0.16);
      --silang: #ff7b7b;
      --kaca: rgba(255, 255, 255, 0.06);
      --kaca-ringan: rgba(255, 255, 255, 0.05);
      --kaca-tepi: rgba(255, 255, 255, 0.17);
      --kilau: rgba(255, 255, 255, 0.2);
      --cincin: rgba(0, 0, 0, 0);
      --bayang: rgba(0, 0, 0, 0.5);
      --panel: rgba(22, 26, 36, 0.86);
      --emas: #d9bd82;
      --emas-muda: #f3e5bd;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow-x: clip; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Latar kaca yang sama dengan halaman utama */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vmax 60vmax at 8% -6%, rgba(236, 214, 160, 0.6), transparent 60%),
      radial-gradient(55vmax 55vmax at 106% 22%, rgba(150, 185, 235, 0.5), transparent 60%),
      radial-gradient(60vmax 60vmax at 40% 112%, rgba(236, 178, 208, 0.38), transparent 60%),
      linear-gradient(160deg, #f7f5f0, #e8edf6);
  }
  @media (prefers-color-scheme: dark) {
    body::before {
      background:
        radial-gradient(60vmax 60vmax at 8% -6%, rgba(176, 141, 79, 0.3), transparent 60%),
        radial-gradient(55vmax 55vmax at 106% 22%, rgba(70, 110, 200, 0.32), transparent 60%),
        radial-gradient(60vmax 60vmax at 40% 112%, rgba(120, 70, 160, 0.24), transparent 60%),
        linear-gradient(160deg, #0b0d12, #0e121b);
    }
  }

  /* Halaman */
  #kajian-online { min-height: 100%; padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  #kajian-online h1 { margin: 0 0 14px; font-family: var(--serif); font-weight: 500; font-size: 1.6rem; letter-spacing: -0.01em; }
  @media (min-width: 769px) {
    #kajian-online { padding-top: calc(40px + env(safe-area-inset-top, 0px)); }
    #kajian-online .lebar { max-width: 960px; margin: 0 auto; }
  }

  /* Permukaan kaca, untuk dipakai saat isi ditambahkan */
  .kartu {
    background: var(--kaca);
    -webkit-backdrop-filter: blur(22px) saturate(165%);
    backdrop-filter: blur(22px) saturate(165%);
    border: 1px solid var(--kaca-tepi);
    border-radius: 22px; padding: 14px;
    box-shadow: inset 0 1px 0 var(--kilau), 0 0 0 1px var(--cincin), 0 10px 32px var(--bayang);
  }
  .kartu h2 { margin: 0 0 12px; font-family: var(--serif); font-weight: 500; font-size: 1.05rem; }

  /* Pemutar & daftar video */
  .pemutar { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; }
  .pemutar iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .daftar { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 4px; }
  @media (min-width: 560px) { .daftar { grid-template-columns: repeat(2, 1fr); } }
  @media (min-width: 769px) { .daftar { grid-template-columns: repeat(3, 1fr); } }
  .video {
    display: flex; flex-direction: column; gap: 8px; padding: 8px; text-align: left; cursor: pointer;
    font: inherit; color: inherit; background: var(--kaca-ringan);
    border: 1px solid var(--kaca-tepi); border-radius: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .video:active { background: var(--press); }
  .video img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: var(--press); }
  .video span.judul { font-size: 0.86rem; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .video span.tgl { font-size: 0.72rem; opacity: 0.65; }
  .video.aktif { border-color: var(--emas); }
  .kartu + .kartu { margin-top: 14px; }
  .catatan { font-size: 0.85rem; opacity: 0.75; margin: 0; }
  .catatan a { color: var(--emas); }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --kaca: rgba(250, 251, 253, 0.85); }
    @media (prefers-color-scheme: dark) { :root { --kaca: rgba(24, 28, 38, 0.9); } }
  }
</style>
</head>
<body>
  <main id="kajian-online" aria-label="Kajian Online">
    <div class="lebar">
      <h1>Kajian Online</h1>
      <div id="kajian-isi">
        <section class="kartu">
          <h2>Ustadz Firanda Andirja</h2>
          <div class="pemutar"><iframe id="pemutar" title="Pemutar kajian" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
          <p class="catatan" style="margin-top:10px"><a id="buka-yt" href="https://www.youtube.com/channel/UCm44PmruoSbuNbZn7jFeXUw" target="_blank" rel="noopener">Buka di YouTube</a> jika video tidak muncul.</p>
        </section>
        <section class="kartu">
          <h2>Video terbaru</h2>
          <div class="daftar" id="daftar"><p class="catatan">Memuat video…</p></div>
        </section>
      </div>
    </div>
  </main>
<script>
(function () {
  var CH = 'UCm44PmruoSbuNbZn7jFeXUw';
  var RSS = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + CH;
  var pemutar = document.getElementById('pemutar');
  var daftar = document.getElementById('daftar');

  function gagal() {
    daftar.innerHTML = '<p class="catatan">Daftar video belum bisa dimuat. Pemutar di atas tetap memutar semua upload, atau buka <a href="https://www.youtube.com/channel/' + CH + '" target="_blank" rel="noopener">channel di YouTube</a>.</p>';
  }
  function tgl(s) {
    var d = new Date(String(s).replace(' ', 'T') + (String(s).indexOf('T') < 0 ? 'Z' : ''));
    return isNaN(d) ? '' : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
  }
  function putar(id, tombol) {
    pemutar.src = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1';
    document.getElementById('buka-yt').href = 'https://www.youtube.com/watch?v=' + id;
    daftar.querySelectorAll('.video').forEach(function (b) { b.classList.remove('aktif'); });
    if (tombol) tombol.classList.add('aktif');
    pemutar.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(RSS))
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.items || !j.items.length) return gagal();
      daftar.innerHTML = '';
      j.items.forEach(function (it) {
        var m = /[?&]v=([^&]+)/.exec(it.link || '');
        if (!m) return;
        var id = m[1];
        var b = document.createElement('button');
        b.type = 'button'; b.className = 'video';
        var img = document.createElement('img');
        img.loading = 'lazy'; img.alt = '';
        img.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
        var jd = document.createElement('span'); jd.className = 'judul'; jd.textContent = it.title;
        var tg = document.createElement('span'); tg.className = 'tgl'; tg.textContent = tgl(it.pubDate);
        b.appendChild(img); b.appendChild(jd); b.appendChild(tg);
        b.addEventListener('click', function () { putar(id, b); });
        daftar.appendChild(b);
      });
      if (!daftar.children.length) return gagal();
      var m0 = /[?&]v=([^&]+)/.exec(j.items[0].link || '');
      if (m0) {
        pemutar.src = 'https://www.youtube-nocookie.com/embed/' + m0[1] + '?rel=0&playsinline=1';
        document.getElementById('buka-yt').href = 'https://www.youtube.com/watch?v=' + m0[1];
        daftar.firstElementChild.classList.add('aktif');
      }
    })
    .catch(gagal);
})();
</script>
</body>
</html>
