<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Kajian Online</title>
<meta name="theme-color" content="#0b0d12">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #ffffff;
    --text: #14181f;
    --glass-bg: rgba(120, 140, 170, 0.10);
    --glass-edge: rgba(20, 30, 50, 0.18);
    --glass-shade: rgba(20, 30, 50, 0.22);
    --glass-glow: rgba(255, 255, 255, 0.9);
    --press: rgba(20, 30, 50, 0.07);
    --garis: rgba(20, 30, 50, 0.14);
    --silang: #d64545;
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --kaca: rgba(255, 255, 255, 0.42);
    --kaca-ringan: rgba(255, 255, 255, 0.28);
    --kaca-tepi: rgba(255, 255, 255, 0.8);
    --kilau: rgba(255, 255, 255, 0.95);
    --cincin: rgba(30, 40, 70, 0.08);
    --bayang: rgba(40, 55, 90, 0.14);
    --panel: rgba(250, 251, 253, 0.86);
    --emas: #b08d4f;
    --emas-muda: #ecdcb0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --text: #eef1f6;
      --glass-bg: rgba(255, 255, 255, 0.07);
      --glass-edge: rgba(255, 255, 255, 0.28);
      --glass-shade: rgba(0, 0, 0, 0.55);
      --glass-glow: rgba(255, 255, 255, 0.22);
      --press: rgba(255, 255, 255, 0.1);
      --garis: rgba(255, 255, 255, 0.16);
      --silang: #ff7b7b;
      --kaca: rgba(255, 255, 255, 0.06);
      --kaca-ringan: rgba(255, 255, 255, 0.05);
      --kaca-tepi: rgba(255, 255, 255, 0.17);
      --kilau: rgba(255, 255, 255, 0.2);
      --cincin: rgba(0, 0, 0, 0);
      --bayang: rgba(0, 0, 0, 0.5);
      --panel: rgba(22, 26, 36, 0.86);
      --emas: #d9bd82;
      --emas-muda: #f3e5bd;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow-x: clip; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Latar kaca yang sama dengan halaman utama */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vmax 60vmax at 8% -6%, rgba(236, 214, 160, 0.6), transparent 60%),
      radial-gradient(55vmax 55vmax at 106% 22%, rgba(150, 185, 235, 0.5), transparent 60%),
      radial-gradient(60vmax 60vmax at 40% 112%, rgba(236, 178, 208, 0.38), transparent 60%),
      linear-gradient(160deg, #f7f5f0, #e8edf6);
  }
  @media (prefers-color-scheme: dark) {
    body::before {
      background:
        radial-gradient(60vmax 60vmax at 8% -6%, rgba(176, 141, 79, 0.3), transparent 60%),
        radial-gradient(55vmax 55vmax at 106% 22%, rgba(70, 110, 200, 0.32), transparent 60%),
        radial-gradient(60vmax 60vmax at 40% 112%, rgba(120, 70, 160, 0.24), transparent 60%),
        linear-gradient(160deg, #0b0d12, #0e121b);
    }
  }

  /* Halaman */
  #kajian-online { min-height: 100%; padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(48px + env(safe-area-inset-bottom, 0px)); }
  .lebar { max-width: 1080px; margin: 0 auto; }
  .kepala { margin: 4px 2px 20px; }
  .alis { display: block; margin-bottom: 8px; font-size: 0.7rem; letter-spacing: 0.24em; text-transform: uppercase; color: var(--emas); }
  .kepala h1 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 2rem; letter-spacing: -0.015em; line-height: 1.1; }
  .kepala p { margin: 8px 0 0; font-size: 0.9rem; opacity: 0.6; }

  /* Permukaan kaca */
  .kartu {
    background: var(--kaca);
    -webkit-backdrop-filter: blur(22px) saturate(165%);
    backdrop-filter: blur(22px) saturate(165%);
    border: 1px solid var(--kaca-tepi);
    border-radius: 24px; padding: 10px;
    box-shadow: inset 0 1px 0 var(--kilau), 0 0 0 1px var(--cincin), 0 10px 32px var(--bayang);
  }

  /* Pilihan channel */
  .pilih {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; margin-bottom: 16px; border-radius: 24px;
    background: var(--kaca); border: 1px solid var(--kaca-tepi);
    -webkit-backdrop-filter: blur(22px) saturate(165%); backdrop-filter: blur(22px) saturate(165%);
    box-shadow: inset 0 1px 0 var(--kilau), 0 0 0 1px var(--cincin);
  }
  .chip {
    flex: 1 1 auto; min-width: 0; padding: 10px 10px; border: 0; border-radius: 20px; cursor: pointer;
    font: inherit; font-size: 0.85rem; line-height: 1.25; text-align: center; color: inherit; opacity: 0.62; background: transparent;
    transition: background 0.25s, opacity 0.25s, box-shadow 0.25s;
    -webkit-tap-highlight-color: transparent;
  }
  .chip.aktif { opacity: 1; background: var(--panel); box-shadow: 0 1px 0 var(--kilau) inset, 0 4px 14px var(--bayang); }

  /* Susunan: pemutar dan daftar */
  .isi { display: grid; gap: 16px; }
  @media (min-width: 900px) {
    #kajian-online { padding-top: calc(48px + env(safe-area-inset-top, 0px)); }
    .isi { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; align-items: start; }
    #kartu-pemutar { position: sticky; top: 24px; }
    .kepala h1 { font-size: 2.4rem; }
  }

  /* Pemutar */
  .pemutar { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #0b0d12; }
  .pemutar iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .keterangan { padding: 14px 8px 6px; }
  .nama { display: block; font-size: 0.7rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--emas); }
  .keterangan h2 {
    margin: 6px 0 10px; font-family: var(--serif); font-weight: 500; font-size: 1.12rem; line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .keterangan h2:empty { display: none; }
  .keterangan a { font-size: 0.82rem; color: var(--emas); text-decoration: none; }
  .keterangan a:active { opacity: 0.6; }

  /* Daftar video */
  .label { margin: 8px 10px 8px; font-size: 0.7rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; opacity: 0.55; }
  .daftar { display: flex; flex-direction: column; gap: 2px; }
  @media (min-width: 900px) { .daftar { max-height: calc(100vh - 150px); overflow-y: auto; scrollbar-width: thin; } }
  .video {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; padding: 8px; text-align: left; cursor: pointer;
    font: inherit; color: inherit; background: transparent; border: 0; border-radius: 16px;
    box-shadow: inset 3px 0 0 transparent;
    transition: background 0.2s, box-shadow 0.2s;
    animation: naik 0.45s both;
    -webkit-tap-highlight-color: transparent;
  }
  .video:active { background: var(--press); }
  @media (hover: hover) { .video:hover { background: var(--press); } }
  .video.aktif { background: var(--press); box-shadow: inset 3px 0 0 var(--emas); }
  .video img { flex: none; width: 128px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 10px; display: block; background: var(--press); }
  .teks { min-width: 0; padding-top: 1px; }
  .video .judul {
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 0.9rem; font-weight: 500; line-height: 1.38;
  }
  .video.aktif .judul { color: var(--emas); }
  .video .tgl { display: block; margin-top: 5px; font-size: 0.74rem; opacity: 0.6; }
  .catatan { margin: 0; padding: 10px; font-size: 0.85rem; opacity: 0.75; }
  .catatan a { color: var(--emas); }

  /* Kerangka saat memuat */
  .rangka { display: flex; gap: 12px; padding: 8px; }
  .rangka i { display: block; border-radius: 10px; background: var(--press); animation: kedip 1.4s ease-in-out infinite; }
  .rangka .a { flex: none; width: 128px; aspect-ratio: 16 / 9; }
  .rangka .b { flex: 1; align-self: stretch; max-height: 56px; }

  @keyframes naik { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes kedip { 50% { opacity: 0.45; } }
  @media (prefers-reduced-motion: reduce) { .video, .rangka i { animation: none; } .chip { transition: none; } }

  /* Tombol garis tiga + blok pojok kiri */
  .menu { position: relative; display: inline-block; margin: 0 0 14px 2px; z-index: 20; }
  .menu-btn {
    width: 44px; height: 44px; padding: 0; border-radius: 50%; cursor: pointer; color: inherit;
    display: flex; align-items: center; justify-content: center;
    background: var(--kaca); border: 1px solid var(--kaca-tepi);
    -webkit-backdrop-filter: blur(22px) saturate(165%); backdrop-filter: blur(22px) saturate(165%);
    box-shadow: inset 0 1px 0 var(--kilau), 0 0 0 1px var(--cincin), 0 8px 22px var(--bayang);
    -webkit-tap-highlight-color: transparent; transition: transform 0.2s;
  }
  .menu-btn:active { transform: scale(0.94); }
  .menu-btn:focus-visible, .menu-item:focus-visible, .kembali:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
  .menu-btn svg { width: 20px; height: 20px; display: block; }
  .menu-btn .x { display: none; }
  .menu-btn[aria-expanded="true"] .tiga { display: none; }
  .menu-btn[aria-expanded="true"] .x { display: block; }
  .menu-blok {
    position: absolute; top: calc(100% + 8px); left: 0; width: 210px; padding: 6px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--kaca-tepi);
    -webkit-backdrop-filter: blur(22px) saturate(165%); backdrop-filter: blur(22px) saturate(165%);
    box-shadow: inset 0 1px 0 var(--kilau), 0 14px 40px var(--bayang);
    animation: turun 0.22s both;
  }
  .menu-blok[hidden] { display: none; }
  .menu-item {
    display: block; width: 100%; padding: 12px 14px; border: 0; border-radius: 14px; cursor: pointer; text-align: left;
    font: inherit; font-size: 0.95rem; color: inherit; background: transparent; -webkit-tap-highlight-color: transparent;
  }
  .menu-item:active { background: var(--press); }
  @media (hover: hover) { .menu-item:hover { background: var(--press); } }
  @keyframes turun { from { opacity: 0; transform: translateY(-6px) scale(0.98); } to { opacity: 1; transform: none; } }

  /* Halaman kedua: Kajian pilihan */
  .halaman { display: none; }
  .halaman.aktif { display: block; }
  .kembali {
    margin: 0 0 14px 2px; padding: 10px 18px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 0.9rem; font-weight: 600; color: inherit;
    background: var(--kaca); border: 1px solid var(--kaca-tepi); box-shadow: inset 0 1px 0 var(--kilau);
    -webkit-tap-highlight-color: transparent;
  }
  .pilihan-isi { max-width: 760px; padding-left: 22px !important; padding-right: 22px !important; }
  .pilihan-isi .kartu { padding: 14px; margin-top: 24px; }
  .pilihan-isi .kartu:first-of-type { margin-top: 8px; }
  .pilihan-isi .keterangan { padding: 16px 6px 6px; }
  .pilihan-isi .kepala { margin-bottom: 22px; }
  .pilihan-isi .kembali { margin-bottom: 20px; }
  @media (prefers-reduced-motion: reduce) { .menu-blok { animation: none; } }

  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --kaca: rgba(250, 251, 253, 0.85); }
    @media (prefers-color-scheme: dark) { :root { --kaca: rgba(24, 28, 38, 0.9); } }
  }
</style>
</head>
<body>
  <main id="kajian-online" class="halaman aktif" aria-label="Kajian Online">
    <div class="lebar">
      <div class="menu" id="menu">
        <button type="button" class="menu-btn" id="menu-btn" aria-label="Buka menu" aria-expanded="false" aria-controls="menu-blok">
          <svg class="tiga" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <svg class="x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        <div class="menu-blok" id="menu-blok" hidden>
          <button type="button" class="menu-item" id="ke-pilihan">Kajian pilihan</button>
        </div>
      </div>
      <header class="kepala">
        <span class="alis">Kajian</span>
        <h1>Kajian Online</h1>
        <p>Kumpulan kajian pilihan</p>
      </header>
      <div class="pilih" id="pilih" role="tablist" aria-label="Pilih channel"></div>
      <div class="isi">
        <section class="kartu" id="kartu-pemutar" aria-label="Pemutar">
          <div class="pemutar"><iframe id="pemutar" title="Pemutar kajian" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
          <div class="keterangan">
            <span class="nama" id="nama-channel"></span>
            <h2 id="judul-video"></h2>
            <a id="buka-yt" href="#" target="_blank" rel="noopener">Buka di YouTube ↗</a>
          </div>
        </section>
        <section class="kartu" aria-label="Video terbaru">
          <h3 class="label" style="font-weight:500">Video terbaru</h3>
          <div class="daftar" id="daftar"></div>
        </section>
      </div>
    </div>
  </main>
  <section id="kajian-pilihan" class="halaman" aria-label="Kajian pilihan">
    <div class="lebar pilihan-isi" style="padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(48px + env(safe-area-inset-bottom, 0px));">
      <button type="button" class="kembali" id="kembali">&lsaquo; Kembali</button>
      <header class="kepala">
        <span class="alis">Kajian</span>
        <h1>Kajian pilihan</h1>
      </header>
      <section class="kartu" aria-label="Pemutar kajian pilihan">
        <div class="pemutar"><iframe id="pemutar-pilihan" title="Kajian pilihan" data-src="https://www.youtube-nocookie.com/embed/pyGUrhJ9tdw?rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
        <div class="keterangan">
          <a href="https://www.youtube.com/watch?v=pyGUrhJ9tdw" target="_blank" rel="noopener">Buka di YouTube ↗</a>
        </div>
      </section>
      <section class="kartu" aria-label="Pemutar kajian pilihan 2">
        <div class="pemutar"><iframe title="Kajian pilihan 2" data-src="https://www.youtube-nocookie.com/embed/wkNt6T-NMME?rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
        <div class="keterangan">
          <a href="https://www.youtube.com/watch?v=wkNt6T-NMME" target="_blank" rel="noopener">Buka di YouTube ↗</a>
        </div>
      </section>
      <section class="kartu" aria-label="Pemutar kajian pilihan 3">
        <div class="pemutar"><iframe title="Kajian pilihan 3" data-src="https://www.youtube-nocookie.com/embed/KOOu_qZOyIE?rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
        <div class="keterangan">
          <a href="https://www.youtube.com/watch?v=KOOu_qZOyIE" target="_blank" rel="noopener">Buka di YouTube ↗</a>
        </div>
      </section>
    </div>
  </section>
<script>
(function () {
  var btn = document.getElementById('menu-btn');
  var blok = document.getElementById('menu-blok');
  var utama = document.getElementById('kajian-online');
  var pilihan = document.getElementById('kajian-pilihan');
  function tutup() { blok.hidden = true; btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-label', 'Buka menu'); }
  function buka() { blok.hidden = false; btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-label', 'Tutup menu'); }
  btn.addEventListener('click', function (e) { e.stopPropagation(); blok.hidden ? buka() : tutup(); });
  document.addEventListener('click', function (e) { if (!blok.hidden && !blok.contains(e.target)) tutup(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') tutup(); });
  function tampil() {
    var p = location.hash === '#pilihan';
    utama.classList.toggle('aktif', !p);
    pilihan.classList.toggle('aktif', p);
    pilihan.querySelectorAll('iframe[data-src]').forEach(function (f) {
      if (p) { if (!f.getAttribute('src')) f.src = f.getAttribute('data-src'); }
      else { f.removeAttribute('src'); }
    });
    tutup();
    window.scrollTo(0, 0);
  }
  document.getElementById('ke-pilihan').addEventListener('click', function () { location.hash = 'pilihan'; });
  document.getElementById('kembali').addEventListener('click', function () {
    if (history.length > 1 && location.hash === '#pilihan') history.back();
    else location.hash = '';
  });
  window.addEventListener('hashchange', tampil);
  tampil();
})();
</script>
<script>
(function () {
  var CHANNELS = [
    { nama: 'Ustadz Firanda Andirja', pendek: 'Ustadz Firanda', id: 'UCm44PmruoSbuNbZn7jFeXUw' },
    { nama: "Dr. Muamar Ma'ruf, Lc., MA", pendek: "Dr. Muamar Ma'ruf", id: 'UCgTyyJMRRx1iIvbsLNv2bPQ' },
    { nama: 'RodjaTV', pendek: 'RodjaTV', user: 'rodjatv', url: 'https://www.youtube.com/@rodjatv' },
    { nama: 'Syafiq Riza Basalamah Official', pendek: 'Syafiq Riza Basalamah', id: 'UC3_QdDQnRVRDJzq56JTO_Zw' },
    { nama: 'HSI Abdullah Roy', pendek: 'HSI Abdullah Roy', id: 'UCpxXfrttfXNsUXCDvc3MQkQ' },
    { nama: 'Ustadz Abdullah Zaen', pendek: 'Ustadz Abdullah Zaen', id: 'UCG1J82SWO58QLRYZkO0lKhA' },
    { nama: 'Ashiil TV', pendek: 'Ashiil TV', id: 'UC-tEtTRwEpRmlo26dGTpanA' }
  ];
  function laman(ch) { return ch.url || 'https://www.youtube.com/channel/' + ch.id; }
  // Channel tanpa ID: cari ID-nya dari halaman channel, lalu simpan di perangkat.
  // Bila channel punya url, ID dicari dari halamannya lebih dulu; id bawaan hanya cadangan.
  function cariId(ch) {
    if (ch.id && !ch.url) return Promise.resolve(ch.id);
    var k = 'kajian_id_' + ch.user;
    try { var c = localStorage.getItem(k); if (c) return Promise.resolve(c); } catch (e) {}
    return fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(ch.url))
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var m = /rel="canonical" href="https:\/\/www\.youtube\.com\/channel\/(UC[\w-]{22})"/.exec(t) ||
                /"externalId":"(UC[\w-]{22})"/.exec(t) ||
                /"channelId":"(UC[\w-]{22})"/.exec(t);
        if (!m) throw new Error('id');
        try { localStorage.setItem(k, m[1]); } catch (e) {}
        return m[1];
      })
      .catch(function (e) { if (ch.id) return ch.id; throw e; });
  }
  function umpan(ch) {
    return 'https://www.youtube.com/feeds/videos.xml?' + (ch.id ? 'channel_id=' + ch.id : 'user=' + ch.user);
  }
  var pemutar = document.getElementById('pemutar');
  var daftar = document.getElementById('daftar');
  var pilih = document.getElementById('pilih');
  var bukaYt = document.getElementById('buka-yt');
  var judulVideo = document.getElementById('judul-video');
  var aktif = 0, token = 0;

  function rangka() {
    daftar.innerHTML = '';
    for (var i = 0; i < 6; i++) {
      var r = document.createElement('div');
      r.className = 'rangka';
      r.innerHTML = '<i class="a"></i><i class="b"></i>';
      daftar.appendChild(r);
    }
  }
  var sedangId = null, perluMuat = false;
  function tombolUlang() {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'kembali'; b.style.margin = '8px 0 0'; b.textContent = 'Coba lagi';
    b.addEventListener('click', function () { muat(); });
    return b;
  }
  function gagal(ch) {
    perluMuat = true;
    daftar.innerHTML = '<p class="catatan">Daftar video belum bisa dimuat. Periksa koneksi, lalu coba lagi, atau buka <a href="' + laman(ch) + '" target="_blank" rel="noopener">channel di YouTube</a>.</p>';
    daftar.lastChild.appendChild(document.createElement('br'));
    daftar.lastChild.appendChild(tombolUlang());
  }
  // Simpan daftar terakhir di perangkat agar tetap tampil kapan saja
  function simpan(ch, items) {
    try { localStorage.setItem('kajian_daftar_' + ch.pendek, JSON.stringify({ w: Date.now(), items: items })); } catch (e) {}
  }
  function baca(ch) {
    try { var s = localStorage.getItem('kajian_daftar_' + ch.pendek); return s ? JSON.parse(s) : null; } catch (e) { return null; }
  }
  function dariRss2json(ch) {
    return fetch('https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(umpan(ch)))
      .then(function (r) { return r.json(); })
      .then(function (j) {
        var out = [];
        (j.items || []).forEach(function (it) {
          var m = /[?&]v=([^&]+)/.exec(it.link || '');
          if (m) out.push({ id: m[1], title: it.title, pubDate: it.pubDate });
        });
        if (!out.length) throw new Error('kosong');
        return out;
      });
  }
  // Cadangan bila layanan pertama gagal: baca umpan YouTube lewat proxy lain
  function dariXml(ch) {
    return fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(umpan(ch)))
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var x = new DOMParser().parseFromString(t, 'text/xml'), out = [];
        Array.prototype.forEach.call(x.getElementsByTagName('entry'), function (e) {
          var v = e.getElementsByTagName('yt:videoId')[0], ti = e.getElementsByTagName('title')[0], p = e.getElementsByTagName('published')[0];
          if (v && ti) out.push({ id: v.textContent, title: ti.textContent, pubDate: p ? p.textContent : '' });
        });
        if (!out.length) throw new Error('kosong');
        return out;
      });
  }
  function tampil(items, ch) {
    daftar.innerHTML = '';
    var pertama = null;
    items.forEach(function (it, n) {
      var id = it.id;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'video';
      b.style.animationDelay = Math.min(n, 10) * 35 + 'ms';
      var img = document.createElement('img');
      img.loading = 'lazy'; img.alt = '';
      img.src = 'https://i.ytimg.com/vi/' + id + '/mqdefault.jpg';
      var teks = document.createElement('span'); teks.className = 'teks';
      var jd = document.createElement('span'); jd.className = 'judul'; jd.textContent = it.title;
      var tg = document.createElement('span'); tg.className = 'tgl'; tg.textContent = tgl(it.pubDate);
      teks.appendChild(jd); teks.appendChild(tg);
      b.appendChild(img); b.appendChild(teks);
      b.addEventListener('click', function () { putar(id, it.title, b, true); });
      if (id === sedangId) b.classList.add('aktif');
      daftar.appendChild(b);
      if (!pertama) pertama = { id: id, judul: it.title, tombol: b };
    });
    if (!pertama) return gagal(ch);
    if (!sedangId) putar(pertama.id, pertama.judul, pertama.tombol, false);
  }
  function tgl(s) {
    var d = new Date(String(s).replace(' ', 'T') + (String(s).indexOf('T') < 0 ? 'Z' : ''));
    return isNaN(d) ? '' : d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
  }
  function putar(id, judul, tombol, otomatis) {
    pemutar.src = 'https://www.youtube-nocookie.com/embed/' + id + '?rel=0&playsinline=1' + (otomatis ? '&autoplay=1' : '');
    bukaYt.href = 'https://www.youtube.com/watch?v=' + id;
    judulVideo.textContent = judul || '';
    sedangId = id;
    daftar.querySelectorAll('.video').forEach(function (b) { b.classList.remove('aktif'); });
    if (tombol) tombol.classList.add('aktif');
    if (otomatis) {
      var k = document.getElementById('kartu-pemutar').getBoundingClientRect();
      if (k.top < 0 || k.bottom > window.innerHeight) {
        document.getElementById('kartu-pemutar').scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
  }
  function tombolChannel() {
    pilih.textContent = '';
    CHANNELS.forEach(function (ch, i) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'chip' + (i === aktif ? ' aktif' : '');
      b.setAttribute('role', 'tab');
      b.setAttribute('aria-selected', i === aktif ? 'true' : 'false');
      b.textContent = ch.pendek;
      b.addEventListener('click', function () { if (i !== aktif) { aktif = i; muat(); } });
      pilih.appendChild(b);
    });
  }
  function muat() {
    var ch = CHANNELS[aktif], t = ++token;
    tombolChannel();
    document.getElementById('nama-channel').textContent = ch.nama;
    judulVideo.textContent = '';
    bukaYt.href = laman(ch);
    pemutar.removeAttribute('src');
    sedangId = null; perluMuat = false;
    // Tampilkan daftar tersimpan lebih dulu agar langsung muncul, lalu perbarui
    var cache = baca(ch), adaCache = !!(cache && cache.items && cache.items.length);
    if (adaCache) tampil(cache.items, ch); else rangka();
    cariId(ch).catch(function () { return null; })
      .then(function (id) {
        if (id) ch.id = id;
        return dariRss2json(ch).catch(function () { return dariXml(ch); });
      })
      .then(function (items) {
        if (t !== token) return;
        simpan(ch, items);
        tampil(items, ch);
      })
      .catch(function () {
        if (t !== token) return;
        if (!adaCache) return gagal(ch);
        perluMuat = true;
        var n = document.createElement('p');
        n.className = 'catatan';
        n.textContent = 'Menampilkan daftar tersimpan (' + new Date(cache.w).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) + '). Belum bisa memperbarui. ';
        n.appendChild(tombolUlang());
        daftar.insertBefore(n, daftar.firstChild);
      });
  }
  window.addEventListener('online', function () { if (perluMuat) muat(); });
  muat();
})();
</script>
