<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Doa dan Dzikir Sebelum Tidur</title>
<meta name="theme-color" content="#0b0d12">
<style>
  :root {
    --bg: #ffffff;
    --text: #14181f;
    --press: rgba(20, 30, 50, 0.07);
    --garis: rgba(20, 30, 50, 0.14);
    --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --kaca: rgba(255, 255, 255, 0.42);
    --kaca-ringan: rgba(255, 255, 255, 0.28);
    --kaca-tepi: rgba(255, 255, 255, 0.8);
    --kilau: rgba(255, 255, 255, 0.95);
    --cincin: rgba(30, 40, 70, 0.08);
    --bayang: rgba(40, 55, 90, 0.14);
    --panel: rgba(250, 251, 253, 0.86);
    --emas: #b08d4f;
    --emas-muda: #ecdcb0;
    --pegas: cubic-bezier(0.34, 1.3, 0.5, 1);
    --halus: cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0d12;
      --text: #eef1f6;
      --press: rgba(255, 255, 255, 0.1);
      --garis: rgba(255, 255, 255, 0.16);
      --kaca: rgba(255, 255, 255, 0.06);
      --kaca-ringan: rgba(255, 255, 255, 0.05);
      --kaca-tepi: rgba(255, 255, 255, 0.17);
      --kilau: rgba(255, 255, 255, 0.2);
      --cincin: rgba(0, 0, 0, 0);
      --bayang: rgba(0, 0, 0, 0.5);
      --panel: rgba(22, 26, 36, 0.86);
      --emas: #d9bd82;
      --emas-muda: #f3e5bd;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html, body { overflow-x: clip; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* Latar kaca bening */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(60vmax 60vmax at 8% -6%, rgba(236, 214, 160, 0.6), transparent 60%),
      radial-gradient(55vmax 55vmax at 106% 22%, rgba(150, 185, 235, 0.5), transparent 60%),
      radial-gradient(60vmax 60vmax at 40% 112%, rgba(236, 178, 208, 0.38), transparent 60%),
      linear-gradient(160deg, #f7f5f0, #e8edf6);
  }
  @media (prefers-color-scheme: dark) {
    body::before {
      background:
        radial-gradient(60vmax 60vmax at 8% -6%, rgba(176, 141, 79, 0.3), transparent 60%),
        radial-gradient(55vmax 55vmax at 106% 22%, rgba(70, 110, 200, 0.32), transparent 60%),
        radial-gradient(60vmax 60vmax at 40% 112%, rgba(120, 70, 160, 0.24), transparent 60%),
        linear-gradient(160deg, #0b0d12, #0e121b);
    }
  }

  /* Halaman */
  #halaman {
    min-height: 100%;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 16px calc(40px + env(safe-area-inset-bottom, 0px));
  }
  .lebar { max-width: 440px; margin: 0 auto; }
  @media (min-width: 769px) { #halaman { padding-top: calc(40px + env(safe-area-inset-top, 0px)); } }

  .kepala { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
  h1 {
    margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.6rem;
    letter-spacing: -0.01em; line-height: 1.2;
  }
  .sub { margin: 0 0 18px; font-size: 0.85rem; opacity: 0.65; }

  /* Tombol kaca */
  .kembali {
    display: inline-flex; align-items: center; gap: 6px; margin-bottom: 14px;
    font: inherit; font-size: 0.85rem; font-weight: 550; color: var(--text); text-decoration: none;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    background: var(--kaca-ringan);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    border: 1px solid var(--kaca-tepi);
    box-shadow: inset 0 1px 0 var(--kilau);
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.2s var(--halus), background-color 0.25s ease, box-shadow 0.25s ease;
  }
  .kembali:hover { background: var(--press); transform: translateY(-1px); box-shadow: inset 0 1px 0 var(--kilau), 0 6px 16px var(--bayang); }
  .kembali:active { transform: scale(0.95); }
  .kembali:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

  /* Kartu kaca (wadah kelompok doa/dzikir) */
  .kartu {
    position: relative; padding: 16px 18px; margin-bottom: 14px; border-radius: 26px;
    background: var(--kaca);
    -webkit-backdrop-filter: blur(26px) saturate(180%); backdrop-filter: blur(26px) saturate(180%);
    border: 1px solid var(--kaca-tepi);
    box-shadow: inset 0 1px 0 var(--kilau), 0 0 0 1px var(--cincin), 0 12px 32px var(--bayang);
  }
  .kartu h2 { margin: 0; font-family: var(--serif); font-weight: 500; font-size: 1.05rem; }
  .kartu .cat { margin: 2px 0 6px; font-size: 0.76rem; opacity: 0.6; line-height: 1.4; }

  /* Keadaan kosong */
  .kosong {
    text-align: center; padding: 28px 16px; margin-bottom: 14px; border-radius: 22px; font-size: 0.95rem;
    background: var(--kaca);
    -webkit-backdrop-filter: blur(22px) saturate(165%); backdrop-filter: blur(22px) saturate(165%);
    border: 1px solid var(--kaca-tepi);
    box-shadow: inset 0 1px 0 var(--kilau), 0 0 0 1px var(--cincin), 0 10px 32px var(--bayang);
  }
  .kosong[hidden] { display: none; }

  /* Garis emas tipis di tepi atas kartu utama */
  .emas::before {
    content: ""; position: absolute; left: 24px; right: 24px; top: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--emas), transparent); opacity: 0.85;
  }

  /* Animasi masuk */
  @keyframes masuk { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  .lebar > * { animation: masuk 0.45s var(--halus) backwards; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* Cadangan bila blur tidak didukung */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --kaca: rgba(250, 251, 253, 0.85); }
    @media (prefers-color-scheme: dark) { :root { --kaca: rgba(24, 28, 38, 0.9); } }
  }
</style>
</head>
<body>
  <main id="halaman" aria-label="Doa dan Dzikir Sebelum Tidur">
    <div class="lebar">
      <a class="kembali" href="index.html#amal-harian">&lsaquo; Amal Harian</a>
      <div class="kepala">
        <h1>Doa dan Dzikir Sebelum Tidur</h1>
      </div>
      <p class="sub"></p>

      <!-- Kelompok doa/dzikir akan ditambahkan di sini, berupa kartu: <section class="kartu"><h2>…</h2>…</section> -->
      <div id="isi"></div>

      <div class="kosong" id="kosong">Isi belum ditambahkan.</div>
    </div>
  </main>

<script>
  /* Dibuka dalam jendela di Amal Harian: tombol kembali tidak perlu (ada tombol Tutup) */
  if (window.self !== window.top) {
    var kb = document.querySelector('.kembali');
    if (kb) kb.style.display = 'none';
  }
  /* Sembunyikan keadaan kosong bila #isi sudah berisi */
  (function () {
    var isi = document.getElementById('isi'), kosong = document.getElementById('kosong');
    function cek() { kosong.hidden = isi.children.length > 0; }
    new MutationObserver(cek).observe(isi, { childList: true });
    cek();
  })();
</script>
</body>
</html>
